<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>免费额度雷达 | AI 免费额度中心</title>
<style>
  :root { --ink: #1c1a17; --muted: #6b6560; --line: #e3ded6; --paper: #faf8f4; --card: #fff; --accent: #c2410c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { max-width: 960px; margin: 0 auto; padding: 32px 20px 8px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  header p { margin: 4px 0; color: var(--muted); }
  .bar { max-width: 960px; margin: 16px auto 0; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar input[type="search"] { flex: 1; min-width: 200px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); font: inherit; }
  .bar select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); font: inherit; }
  .bar label { color: var(--muted); font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 20px 48px; }
  #count { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card h2 a { color: var(--ink); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .tag.hot { border-color: var(--accent); color: var(--accent); }
  .score { font-weight: 700; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta a { color: var(--muted); }
  footer { max-width: 960px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>免费额度雷达</h1>
  <p>每天复核一次的 AI 免费额度清单。只收录核实过的、不需要绑信用卡的额度，过期就下架。</p>
  <p id="meta">正在加载数据…</p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="搜名称、描述、来源…" aria-label="搜索">
  <select id="cat" aria-label="分类">
    <option value="">全部分类</option>
    <option value="api">大模型 API</option>
    <option value="app">应用</option>
    <option value="cloud">云服务</option>
    <option value="dev">开发工具</option>
    <option value="compute">算力</option>
  </select>
  <select id="sort" aria-label="排序">
    <option value="avg">按评分排序</option>
    <option value="new">新上的优先</option>
    <option value="expiring">即将过期的优先</option>
  </select>
  <label><input id="onlyNew" type="checkbox"> 只看新上</label>
  <label><input id="onlyExpiring" type="checkbox"> 只看即将过期</label>
</div>
<main>
  <p id="count"></p>
  <div id="list"></div>
</main>
<footer>
  <p>数据来源：懒猫 AI、AIHot、赛博鸡蛋、白嫖计 + 厂商官方页。领之前以官网为准，额度变动很快。数据文件：<a href="../data/data.json">data.json</a></p>
</footer>
<script>
let items = [], meta = {};
const catName = { api: "大模型 API", app: "应用", cloud: "云服务", dev: "开发工具", compute: "算力" };
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const cat = document.getElementById("cat").value;
  const sort = document.getElementById("sort").value;
  const onlyNew = document.getElementById("onlyNew").checked;
  const onlyExpiring = document.getElementById("onlyExpiring").checked;
  let list = items.filter(it => {
    if (cat && it.category !== cat) return false;
    if (onlyNew && !it.is_new) return false;
    if (onlyExpiring && !it.expiring) return false;
    if (q && !(it.title + it.desc + it.source + it.quota).toLowerCase().includes(q)) return false;
    return true;
  });
  if (sort === "avg") list.sort((a, b) => b.avg - a.avg);
  if (sort === "new") list.sort((a, b) => (b.is_new - a.is_new) || (b.avg - a.avg));
  if (sort === "expiring") list.sort((a, b) => (b.expiring - a.expiring) || (b.avg - a.avg));
  document.getElementById("count").textContent = `共 ${list.length} 条（全部 ${items.length} 条）`;
  document.getElementById("list").innerHTML = list.map(it => `
    <article class="card">
      <h2><a href="${esc(it.claim_url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
      <div class="tags">
        <span class="tag">${esc(catName[it.category] || it.category)}</span>
        <span class="tag">评分 <span class="score">${esc(it.avg)}</span></span>
        ${it.is_new ? '<span class="tag hot">新上</span>' : ""}
        ${it.expiring ? '<span class="tag hot">即将过期</span>' : ""}
        <span class="tag">${esc(it.type || "")}</span>
      </div>
      <p>${esc(it.desc)}</p>
      <p><strong>额度：</strong>${esc(it.quota)}　<strong>到期：</strong>${esc(it.expires)}</p>
      <p class="meta">来源：${esc(it.source)} · 核实于 ${esc(it.verified)} ·
        <a href="${esc(it.source_url)}" target="_blank" rel="noopener">来源链接</a> ·
        <a href="${esc(it.claim_url)}" target="_blank" rel="noopener">去领取</a></p>
      <p class="meta">成本：${esc(it.cost)}　风险：${esc(it.risk)}</p>
    </article>`).join("") || "<p>没有符合条件的条目。</p>";
}
fetch("../data/data.json").then(r => r.json()).then(d => {
  items = d.items; meta = d.meta;
  document.getElementById("meta").textContent =
    `核实日期 ${meta.verified_date} · 今日可领总额 ${meta.aihot_daily_total || ""} · 数据每天复核一次`;
  render();
}).catch(() => {
  document.getElementById("meta").textContent = "数据加载失败：请用静态服务器打开本站（例如 python3 -m http.server），不要直接双击文件打开。";
});
["q", "cat", "sort", "onlyNew", "onlyExpiring"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
</script>
</body>
</html>
